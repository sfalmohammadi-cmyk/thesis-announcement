<style>
:root{
  color-scheme: light;
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#123B63; --text:#1F2A3A; --muted:#6C7383;
  --line:#DDD8CE; --gold:#9E7B5B; --gold-soft:#F4EDE4; --navy:#123B63; --ok:#1E7A4D; --warn-bg:#FFF3DF; --warn:#9A5B00;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#15192A; --surface:#1E2437; --ink:#E9EEF8; --text:#E9EEF8; --muted:#A3ABBF; --line:#333B55; --gold:#C9A77F; --gold-soft:#2A2A2A; --navy:#5A86C5; --warn-bg:#3A2E16; --warn:#F2C078;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#15192A; --surface:#1E2437; --ink:#E9EEF8; --text:#E9EEF8; --muted:#A3ABBF; --line:#333B55; --gold:#C9A77F; --gold-soft:#2A2A2A; --navy:#5A86C5; --warn-bg:#3A2E16; --warn:#F2C078;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--text); font-family:"Hacen Tunisia","Tajawal",system-ui,sans-serif; font-size:16px; line-height:1.6;}
main{max-width:980px; margin:0 auto; padding:20px 16px 56px;}
header{margin-bottom:16px}
h1{font-size:1.45rem; font-weight:700; color:var(--ink); margin:0 0 2px;}
header p{margin:0; color:var(--muted); font-size:.95rem}

.layout{display:grid; gap:18px;}
@media (min-width:860px){ .layout{grid-template-columns: 1fr 1fr; align-items:start;} .preview{position:sticky; top:12px;} }

.preview{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:12px;}
.stage{width:100%; aspect-ratio:1491/1055; border-radius:10px; overflow:hidden; background:#fff; border:1px solid var(--line);}
.stage canvas{width:100%; height:100%; display:block;}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.actions.three{grid-template-columns:1fr 1fr 1fr}
button{font:inherit; font-weight:500; cursor:pointer; border-radius:14px; padding:13px 14px; border:1px solid var(--line); background:var(--surface); color:var(--text); min-height:50px;}
button.primary{background:var(--navy); color:#fff; border-color:transparent;}
button.gold{background:var(--gold); color:#fff; border-color:transparent;}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--navy); outline-offset:2px}
.status{font-size:.85rem; color:var(--muted); text-align:center; margin:10px 0 0; min-height:1.2em;}

.form{display:grid; gap:14px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px;}
.card h2{font-size:1rem; margin:0 0 10px; color:var(--ink); font-weight:700}
.field{display:grid; gap:6px; margin-bottom:12px;}
.field:last-child{margin-bottom:0}
label{font-weight:500}
.hint{color:var(--muted); font-size:.85rem; margin:0}
input[type="text"],input[type="url"],textarea,select{width:100%; font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px;}
textarea{min-height:92px; resize:vertical; line-height:1.7}
input.ltr{direction:ltr; text-align:left}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.seg label{display:flex; align-items:center; justify-content:center; padding:11px; cursor:pointer; font-weight:500; background:var(--surface);}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg input:checked + label{background:var(--navy); color:#fff}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.qrline{display:flex; gap:10px; align-items:center}
.qrline input{flex:1}
.warn{display:none; font-size:.85rem; color:var(--warn); background:var(--warn-bg); padding:8px 12px; border-radius:10px;}
.warn.show{display:block}
.toast{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); inset-inline:0; display:flex; justify-content:center; pointer-events:none;}
.toast div{background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.9rem; opacity:0; transform:translateY(8px); transition:.2s}
.toast div.show{opacity:1; transform:none}
footer{margin-top:24px; color:var(--muted); font-size:.85rem; text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>إعلان مناقشة خطة بحثية</h1>
    <p>كلية التربية — قسم المناهج وطرق التدريس. عبّي الحقول وتظهر المعاينة مباشرة.</p>
  </header>

  <div class="layout">
    <section class="preview" aria-label="المعاينة">
      <div class="stage"><canvas id="cv" aria-label="معاينة الإعلان"></canvas></div>
      <div class="actions three" id="actions">
        <button class="primary" id="savePng">حفظ صورة</button>
        <button class="gold" id="savePdf">حفظ PDF</button>
        <button id="share">مشاركة</button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <section class="form" aria-label="بيانات الإعلان">
      <div class="card">
        <h2>نوع المناقشة</h2>
        <div class="field">
          <div class="seg" role="radiogroup" aria-label="الدرجة العلمية">
            <input type="radio" name="degree" id="degM" value="master" checked><label for="degM">رسالة ماجستير</label>
            <input type="radio" name="degree" id="degD" value="phd"><label for="degD">رسالة الدكتوراه</label>
          </div>
        </div>
        <div class="field">
          <div class="seg" role="radiogroup" aria-label="الطالب أو الطالبة">
            <input type="radio" name="gender" id="gM" value="m" checked><label for="gM">والمقدمة من الطالب</label>
            <input type="radio" name="gender" id="gF" value="f"><label for="gF">والمقدمة من الطالبة</label>
          </div>
        </div>

      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';

<script>
(function(){

    { const f=fitLines(ctx,deg,560,36.9,1); text(ctx, deg, 745, 432, f.size, '#ffffff'); }

    const t=val('title');

      const lh=size*1.4, total=lh*lines.length, y0=579-total/2+lh/2;
      lines.forEach((l,i)=>text(ctx,l,739,y0+i*lh,size,NAVY));
    }

    // student label + name
    { const lab=gender()==='f' ? 'والمقدمة من الطالبة' : 'والمقدمة من الطالب'; const f=fitLines(ctx,lab,360,36.9,1); text(ctx, lab, 737, 744, f.size, NAVY); }

    if(n){ const {size}=fitLines(ctx,n,420,36.9,1); text(ctx,n,736,782,size,NAVY); }

      let size=36.9; if(rs.length>=3) size=28; if(rs.length>=4) size=22;

    }

    if(a){ const {size}=fitLines(ctx,a,290,36.9,1); text(ctx,a,760,921,size,GOLD); }

  }

    await deliver(blob, fileBase()+'.png');
  }

  }

  }

  // persistence (per device)
  const KEY='thesis-announce-v1';
  function save(){ try{ const o={}; fields.forEach(f=>o[f]=$(f).value); o.degree=degree(); o.gender=gender(); localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  function load(){ try{ const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(!o) return; fields.forEach(f=>{ if(o[f]!=null) $(f).value=o[f]; }); if(o.degree==='phd') $('degD').checked=true; if(o.gender==='f') $('gF').checked=true; }catch(e){} }

  fields.forEach(f=>$(f).addEventListener('input',schedule));
  document.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',schedule));
  $('savePng').addEventListener('click',savePng);
  $('savePdf').addEventListener('click',savePdf);
  $('share').addEventListener('click',share);
  if(!navigator.share){ $('share').hidden=true; $('actions').classList.remove('three'); }
  $('reset').addEventListener('click',()=>{ fields.forEach(f=>$(f).value=''); $('day').selectedIndex=0; $('degM').checked=true; $('gM').checked=true; try{localStorage.removeItem(KEY);}catch(e){} render(); });
  window.addEventListener('resize',()=>render());

  load();
  img.onload=()=>render();
  img.src=TEMPLATE_SRC;
  const fontReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('700 36px "Hacen Tunisia"'),document.fonts.load('400 16px "Hacen Tunisia"')]) : Promise.resolve();
  fontReady.then(()=>render()).catch(()=>render());
  render();
})();
</script>
</body>
</html>
